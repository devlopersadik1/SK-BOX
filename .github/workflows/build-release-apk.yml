name: Build Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-release-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build release APK
        run: gradle --no-daemon clean assembleRelease

      - name: Rename release APK
        shell: bash
        run: |
          mkdir -p release
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          cp "$APK" "release/SK-BOX.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SK-BOX-release-apk
          path: release/SK-BOX.apk
          if-no-files-found: error
          retention-days: 14
